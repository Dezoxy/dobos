# CI for Flodni: test every change, publish images only from release tags.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a tag build halfway through publishing
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/dezoxy/flodni

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The image's own build stage: the same Go and Debian packages as docker/Dockerfile,
    # and no dependency on the runner's Ubuntu mirror, which failed to resolve for hours.
    container:
      image: golang:1.26-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: FUSE headers for the cgo build
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 libfuse3-dev pkg-config
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The vendored anacrolix fork keeps its own project's formatting.
      - name: Check formatting
        run: |
          set -eu
          unformatted=$(gofmt -l . | grep -v '^internal/anacrolix-torrent/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - name: Vet
        run: go list ./... | grep -v 'internal/anacrolix-torrent' | xargs -r go vet
      - name: Check the module files are tidy
        run: go mod tidy -diff
      # Say how many test files ran: the suite is still small.
      - name: Test
        run: |
          set -eu
          count=$(find . -name '*_test.go' -not -path './.git/*' -not -path './internal/anacrolix-torrent/*' | wc -l | tr -d ' ')
          echo "### Tests: $count test file(s) outside the vendored engine" >> "$GITHUB_STEP_SUMMARY"
          go list ./... | grep -v 'internal/anacrolix-torrent' | xargs -r go test -race -count=1

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.31.1"
          advanced-security: false # fail this job on findings instead of only uploading them

  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report HIGH and CRITICAL to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - name: Upload to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-dependencies
      # The vendored engine's own go.mod lists modules the main build never links (in Nov 2026,
      # grpc v1.56.3: "main module does not need module google.golang.org/grpc"). It is still
      # reported above; the image scan of the compiled binary is the gate for what ships.
      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: internal/anacrolix-torrent
          skip-setup-trivy: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image:
    name: Image (build, smoke test, scan)
    # Builds and runs the code under test with no write permission and no secret, beside the
    # checks rather than after them. Publish still waits for all of them.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: flodni:ci
          build-args: APP_VERSION=dev-${{ github.sha }}
          # Never shared with the publish job, which builds without any cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The FUSE mount needs the same privileges as on the host; the Control Panel answering
      # proves the engine, the FUSE layer and the HTTP server all started.
      - name: Smoke test
        run: |
          echo '{"telemetry": false, "telemetry_url": "", "scheduler": {"enabled": false}}' > config.json
          docker run -d --name flodni-smoke -p 9080:9080 \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined \
            -v "$PWD/config.json:/config.json" flodni:ci
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9080/control; then
              docker exec flodni-smoke mountpoint -q /mnt/flodni-virtual && exit 0
            fi
            sleep 2
          done
          docker logs flodni-smoke
          exit 1

      # The seeder is the far side of the end-to-end test; it never ships.
      - name: Build e2e seeder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: e2e-seeder
          platforms: linux/amd64
          load: true
          tags: flodni-e2e-seeder:ci
          cache-from: type=gha

      # A local seeder seeds a private torrent on an internal network; the image adds it
      # and the file is read back through FUSE and compared by sha256, for two configs.
      - name: End-to-end stream
        timeout-minutes: 15
        run: bash tests/e2e/run.sh flodni:ci flodni-e2e-seeder:ci

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flodni:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish (release tags only)
    # Only a pushed release tag publishes, never a branch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Every check, but not dependency-review: it runs only for pull requests, and a skipped
    # dependency skips this job too. main changes only through pull requests, which ran it.
    # The secret scan is docs.yml's job and is required on main by the branch ruleset.
    needs: [build-test, workflow-lint, dependency-scan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Protected environment: deployments allowed only from v* tags.
    environment: release
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Flodni
            org.opencontainers.image.licenses=GPL-3.0

      # Pushed by digest only: no tag points at it until the scan below passes.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # No cache: a release never restores layers another run could have written.
          no-cache: true

      - name: Scan the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Tag the scanned digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}:${GITHUB_REF_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
